name: Playwright E2E Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser / project(s) to run (push/PR always use Chromium only)'
        required: false
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - mobile
          - all
      tag:
        description: 'Tag filter (e.g. @smoke, @regression)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  BASE_URL: http://automationexercise.com

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: ${{ matrix.mode == 'manual' && format('Manual E2E ({0})', inputs.browser) || format('Run E2E Tests ({0} - shard {1}/2)', matrix.project, matrix.shard) }}
    timeout-minutes: ${{ matrix.mode == 'manual' && 90 || 60 }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ github.event_name == 'workflow_dispatch' && fromJSON('{"include":[{"mode":"manual"}]}') || fromJSON('{"include":[{"mode":"ci","project":"chromium","shard":1},{"mode":"ci","project":"chromium","shard":2}]}') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        if: matrix.mode == 'ci'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (CI)
        if: matrix.mode == 'ci' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Install Playwright system deps (CI cache hit)
        if: matrix.mode == 'ci' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.project }}

      - name: Install Playwright browsers (manual)
        if: matrix.mode == 'manual'
        run: |
          if [ "${{ inputs.browser }}" = "all" ]; then
            npx playwright install --with-deps
          elif [ "${{ inputs.browser }}" = "mobile" ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps "${{ inputs.browser }}"
          fi

      - name: Run Playwright tests (CI)
        if: matrix.mode == 'ci'
        env:
          PLAYWRIGHT_BLOB_REPORT: '1'
        run: |
          npx playwright test \
            --project=${{ matrix.project }} \
            --shard=${{ matrix.shard }}/2

      - name: Run Playwright tests (manual)
        if: matrix.mode == 'manual'
        env:
          PLAYWRIGHT_BLOB_REPORT: '1'
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          BROWSER="${{ inputs.browser }}"

          run_pw() {
            if [ -n "$TAG" ]; then
              npx playwright test "$@" --grep "$TAG"
            else
              npx playwright test "$@"
            fi
          }

          case "$BROWSER" in
            all)
              run_pw
              ;;
            mobile)
              run_pw --project="Mobile Chrome" --project="Mobile Safari"
              ;;
            *)
              run_pw --project="$BROWSER"
              ;;
          esac

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.mode == 'manual' && format('blob-report-{0}-1', inputs.browser) || format('blob-report-{0}-{1}', matrix.project, matrix.shard) }}
          path: blob-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.mode == 'manual' && format('test-results-{0}-1', inputs.browser) || format('test-results-{0}-{1}', matrix.project, matrix.shard) }}
          path: test-results/
          retention-days: 14

      - name: Upload trace files on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.mode == 'manual' && format('traces-{0}-1', inputs.browser) || format('traces-{0}-{1}', matrix.project, matrix.shard) }}
          path: test-results/**/trace.zip
          retention-days: 14

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript type check
        run: npm run type-check

  deploy-report:
    name: Deploy Playwright Report to GitHub Pages
    needs: test
    if: >
      always() &&
      !cancelled() &&
      (needs.test.result == 'success' || needs.test.result == 'failure') &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload combined HTML report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: all-playwright-reports
          path: playwright-report/
          retention-days: 30

      # Requires repo Settings → Pages → Source: "GitHub Actions" (one-time setup).
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add report link to workflow summary
        if: steps.deployment.outputs.page_url != ''
        run: |
          {
            echo "### Playwright HTML report"
            echo ""
            echo "Open the report in your browser (no artifact download required):"
            echo ""
            echo "${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
